<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ISOGuideBot – ISO 27001 Chatbot</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .chat-container {
      width: 95%;
      max-width: 820px;
      height: 92vh;
      background: #020617;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1f2937;
      padding-bottom: 8px;
      gap: 8px;
    }
    .chat-header h1 { font-size: 1.1rem; margin: 0; }
    .chat-header .sub { font-size: 0.75rem; color: #9ca3af; }
    #status {
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 999px;
      background: #1f2937;
      color: #9ca3af;
      white-space: nowrap;
    }
    #status.ok { background: #052e16; color: #4ade80; }
    #status.warn { background: #422006; color: #fbbf24; }
    #status.down { background: #450a0a; color: #f87171; }
    #messages {
      flex: 1;
      overflow-y: auto;
      border-radius: 8px;
      border: 1px solid #1f2937;
      padding: 12px;
      font-size: 0.92rem;
    }
    .msg { margin-bottom: 14px; display: flex; flex-direction: column; }
    .msg.user { align-items: flex-end; }
    .msg.bot { align-items: flex-start; }
    .bubble {
      max-width: 88%;
      padding: 9px 12px;
      line-height: 1.45;
      white-space: pre-wrap;
    }
    .msg.user .bubble {
      background: #2563eb;
      color: white;
      border-radius: 14px 14px 2px 14px;
    }
    .msg.bot .bubble {
      background: #111827;
      color: #e5e7eb;
      border-radius: 14px 14px 14px 2px;
    }
    .cite {
      color: #60a5fa;
      font-weight: 600;
      font-size: 0.8em;
    }
    .meta {
      margin-top: 4px;
      font-size: 0.7rem;
      color: #6b7280;
    }
    details.sources {
      max-width: 88%;
      margin-top: 6px;
      font-size: 0.78rem;
      color: #9ca3af;
    }
    details.sources summary { cursor: pointer; }
    .source {
      margin-top: 6px;
      padding: 6px 8px;
      border-left: 2px solid #2563eb;
      background: #0b1220;
      white-space: pre-wrap;
    }
    .source b { color: #e5e7eb; }
    .examples { display: flex; flex-wrap: wrap; gap: 6px; }
    .examples button {
      background: #111827;
      color: #9ca3af;
      border: 1px solid #1f2937;
      font-weight: 400;
      font-size: 0.75rem;
      padding: 5px 10px;
    }
    .examples button:hover { color: #e5e7eb; border-color: #2563eb; }
    form { display: flex; gap: 8px; }
    #question {
      flex: 1;
      padding: 9px 12px;
      border-radius: 999px;
      border: 1px solid #1f2937;
      background: #020617;
      color: #e5e7eb;
      outline: none;
      font-size: 0.92rem;
    }
    #question:focus { border-color: #2563eb; }
    button {
      padding: 8px 16px;
      border-radius: 999px;
      border: none;
      background: #22c55e;
      color: #022c22;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <div>
        <h1>ISOGuideBot · ISO/IEC 27001:2022 Helper</h1>
        <div class="sub">Answers grounded in Annex A controls, with cited sources</div>
      </div>
      <span id="status">checking…</span>
    </div>

    <div id="messages" aria-live="polite"></div>

    <div class="examples">
      <button type="button">Do we need MFA?</button>
      <button type="button">What is a clean desk policy?</button>
      <button type="button">What changed in the 2022 version?</button>
      <button type="button">How should we respond to a security incident?</button>
    </div>

    <form id="chat-form">
      <input
        id="question"
        type="text"
        maxlength="1000"
        placeholder="Ask about an ISO 27001 control, e.g. What is a Statement of Applicability?"
        autocomplete="off"
      />
      <button type="submit">Send</button>
    </form>
  </div>

  <script>
    // Backend URL. Override with ?api=http://127.0.0.1:8002 if port 8001 is busy.
    const API_BASE = new URLSearchParams(location.search).get("api") || "http://127.0.0.1:8001";
    const form = document.getElementById("chat-form");
    const input = document.getElementById("question");
    const messages = document.getElementById("messages");
    const sendButton = form.querySelector("button");
    const statusEl = document.getElementById("status");

    const MODE_LABELS = {
      "claude": "Answered by Claude from the sources below",
      "retrieval-only": "Retrieval-only mode: closest matching section",
      "fallback": "Claude unavailable: showing closest matching section",
      "none": "No matching section in the guide",
    };

    // Renders text with [n] citations highlighted. Uses text nodes only,
    // never innerHTML, so user or model text cannot inject HTML.
    function renderWithCitations(el, text) {
      const parts = text.split(/(\[\d+\])/g);
      for (const part of parts) {
        if (/^\[\d+\]$/.test(part)) {
          const span = document.createElement("span");
          span.className = "cite";
          span.textContent = part;
          el.appendChild(span);
        } else {
          el.appendChild(document.createTextNode(part));
        }
      }
    }

    function addMessage(text, sender, data = null) {
      const div = document.createElement("div");
      div.className = "msg " + sender;

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      if (sender === "bot") renderWithCitations(bubble, text);
      else bubble.textContent = text;
      div.appendChild(bubble);

      if (data) {
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = MODE_LABELS[data.mode] || data.mode;
        div.appendChild(meta);

        if (data.sources && data.sources.length) {
          const details = document.createElement("details");
          details.className = "sources";
          const summary = document.createElement("summary");
          const controls = data.sources.map(s => s.control).filter(Boolean);
          summary.textContent = `Sources (${data.sources.length})` +
            (controls.length ? ": " + controls.join(", ") : "");
          details.appendChild(summary);

          for (const s of data.sources) {
            const box = document.createElement("div");
            box.className = "source";
            const label = document.createElement("b");
            label.textContent = `[${s.id}] `;
            box.appendChild(label);
            box.appendChild(document.createTextNode(s.text));
            details.appendChild(box);
          }
          div.appendChild(details);
        }
      }

      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    async function ask(question) {
      addMessage(question, "user");
      sendButton.disabled = true;
      input.disabled = true;
      const thinking = addMessage("Searching the ISO 27001 guide…", "bot");

      try {
        const res = await fetch(API_BASE + "/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question, top_k: 4 }),
        });
        thinking.remove();
        if (!res.ok) {
          addMessage(`Error ${res.status}: ${res.statusText}`, "bot");
          return;
        }
        const data = await res.json();
        addMessage(data.answer || "No answer.", "bot", data);
      } catch (err) {
        console.error(err);
        thinking.remove();
        addMessage("Request failed. Is the backend running on port 8001?", "bot");
      } finally {
        sendButton.disabled = false;
        input.disabled = false;
        input.focus();
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const q = input.value.trim();
      if (!q) return;
      input.value = "";
      ask(q);
    });

    document.querySelectorAll(".examples button").forEach(btn => {
      btn.addEventListener("click", () => ask(btn.textContent));
    });

    async function checkStatus() {
      try {
        const res = await fetch(API_BASE + "/");
        const data = await res.json();
        if (data.mode === "claude") {
          statusEl.textContent = "Claude · " + data.chunks + " chunks";
          statusEl.className = "ok";
        } else {
          statusEl.textContent = "Retrieval only · no API key";
          statusEl.className = "warn";
        }
      } catch {
        statusEl.textContent = "Backend offline";
        statusEl.className = "down";
      }
    }

    addMessage("Hi, I'm ISOGuideBot. Ask me about ISO/IEC 27001:2022 controls and I'll answer with the sections I used.", "bot");
    checkStatus();
    input.focus();
  </script>
</body>
</html>
